name: Echoes of Yendor Android APK Build

on:
  push:
    branches:
      - "work/world-audio-cohesion-rc"
  workflow_dispatch:

concurrency:
  group: echoes-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-apk:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Inject pinned Fusion Pixel font
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "2026.08.11"
          $archive = "fusion-pixel-font-12px-proportional-ttf-v$version.zip"
          $url = "https://github.com/TakWolf/fusion-pixel-font/releases/download/$version/$archive"
          $expected = "58cc7021a24749ad9405845e499a2ef0a1709e2d90adc242cf198cb278dc065e"
          $zip = Join-Path $env:RUNNER_TEMP $archive
          $extract = Join-Path $env:RUNNER_TEMP "fusion-pixel-font"
          curl.exe -L --fail --retry 3 --retry-delay 2 $url -o $zip
          if ($LASTEXITCODE -ne 0) { throw "Failed to download pinned Fusion Pixel Font release." }
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Fusion Pixel Font SHA256 mismatch. Expected $expected, got $actual" }
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $font = Get-ChildItem -Path $extract -Recurse -File -Filter "fusion-pixel-12px-proportional-zh_hans.ttf" | Select-Object -First 1
          if (-not $font) { throw "Pinned archive did not contain fusion-pixel-12px-proportional-zh_hans.ttf" }
          $fontDir = "core/src/main/assets/fonts"
          New-Item -ItemType Directory -Force -Path $fontDir | Out-Null
          Copy-Item $font.FullName (Join-Path $fontDir "fusion_pixel_12_prop_zh_hans.ttf") -Force
          curl.exe -L --fail --retry 3 --retry-delay 2 "https://raw.githubusercontent.com/TakWolf/fusion-pixel-font/$version/LICENSE-OFL" -o (Join-Path $fontDir "FUSION_PIXEL_FONT_LICENSE.txt")
          if ($LASTEXITCODE -ne 0) { throw "Failed to download Fusion Pixel Font OFL license." }
          Write-Host "Pinned Fusion Pixel Font injected and SHA256 verified: $actual"

      - name: Inject pinned Echoes audio assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $assets = @(
            @{ Name="Old Tavern - Cinematic Atmosphere Fairytale"; Url="https://raw.githubusercontent.com/drdreo/dicegame/879776a38da76cee2cda2a63b00cc288d3c235d7/public/sounds/background/old-tavern-cinematic-atmosphere-fairytale-273871.mp3"; Target="core/src/main/assets/music/echoes/ledger_tavern.mp3"; Sha256="4b114794884397d5a02af3569ec9afefedb791083c66db06f113ed4b2b7eebae" },
            @{ Name="Tavern ambience with openfire effect"; Url="https://raw.githubusercontent.com/John-Popovici/duel-of-the-eights/be8b6c799fe500288c6e65b74c12e710d94a7f0d/src/Assets/Audio/Ambience/tavern-ambience-with-openfire-effect-no-loops-86151.mp3"; Target="core/src/main/assets/music/echoes/ledger_ambience.mp3"; Sha256="a258853368ab9b1e4723c3f992059e09e36bdd0fdce99ddf6b2c88190e248860" },
            @{ Name="Daytime Farm Ambience"; Url="https://raw.githubusercontent.com/EdgeGnW/DETTAGameJam2026/b599fb66899ce89224d2218e9896d1e8e394f4c5/modules/AudioManager/daytime-farm-ambience-409990.mp3"; Target="core/src/main/assets/music/echoes/ch1_farm_ambience.mp3"; Sha256="bc6ddb1b50b2082a3d29af3d5c1b6a9b554d33c0745cb0e7c15caa8f2660fe25" },
            @{ Name="Mixkit Forest Birds Ambience"; Url="https://assets.mixkit.co/active_storage/sfx/1210/1210-preview.mp3"; Target="core/src/main/assets/music/echoes/ch1_surface_ambience.mp3"; Sha256="47ab079aac704576d45d252c416de1da31dd016b69b5b9a2eaaa720efb6c2411" },
            @{ Name="Mixkit Water Flowing Ambience Loop"; Url="https://assets.mixkit.co/active_storage/sfx/3126/3126-preview.mp3"; Target="core/src/main/assets/sounds/echoes/ch1_stream_loop.mp3"; Sha256="f66d790fde40c2bad3f36039dd570b819509519d0fb8a3a458b3571a0928a2a0" },
            @{ Name="Mixkit Little Birds Singing"; Url="https://assets.mixkit.co/active_storage/sfx/17/17-preview.mp3"; Target="core/src/main/assets/sounds/echoes/ch1_birds.mp3"; Sha256="31afb3341b8c583038acbdc1a120f2c45699767ddd3a8fa200ec5f72fb54e89f" },
            @{ Name="Mixkit Wolves at Scary Forest"; Url="https://assets.mixkit.co/active_storage/sfx/2485/2485-preview.mp3"; Target="core/src/main/assets/sounds/echoes/ch1_wolves.mp3"; Sha256="d164d2d1abeaf633199cc482b580b224724c94ebab71fd6fe0749aa6d77d09b4" },
            @{ Name="Mixkit Donkey Scream"; Url="https://assets.mixkit.co/active_storage/sfx/1770/1770-preview.mp3"; Target="core/src/main/assets/sounds/echoes/ch1_donkey.mp3"; Sha256="DISCOVER" },
            @{ Name="OpenGameArt Crow Caw CC0"; Url="https://opengameart.org/sites/default/files/crow_caw.wav"; Target="core/src/main/assets/sounds/echoes/ch1_raven_caw.wav"; Sha256="bba22883209b435905471d057160f1badae59b89a62e9a8b3199d7e327b17339" },
            @{ Name="Book Opening"; Url="https://raw.githubusercontent.com/bushnghiem/Project04/cba32629189ca35261bae0e666d9f63afc429830/Audio/book-opening-345808.mp3"; Target="core/src/main/assets/sounds/echoes/ledger_book_open.mp3"; Sha256="137b6b7a15b5415671589c5094394ff9e343000bec42650e04917b0541045ded" },
            @{ Name="Flipping Book Page"; Url="https://raw.githubusercontent.com/mr-vishwakarma/illuster-coaching-classes/c5367b5acf7be172b2b4d3152bdd74b833a1443c/public/sounds/dragon-studio-flipping-book-page-499646.mp3"; Target="core/src/main/assets/sounds/echoes/ledger_page_turn.mp3"; Sha256="600be61dd4591f09cdc1711fa8e07098fd3d948f619a7e096513ed6ab5aa82d8" },
            @{ Name="Book Closing"; Url="https://raw.githubusercontent.com/MikhaellaJingCarumbana/AUTOMA/7d2890fac0d4faf362debdd274665cd65510c896/Chapters/Chapter%201/audios/sounds/book-closing-48311.mp3"; Target="core/src/main/assets/sounds/echoes/ledger_book_close.mp3"; Sha256="bec81ccf7cc302fa3dad21b90cb73394cf9060ef7222006590ee85980c78d0da" },
            @{ Name="Writing Pen Signature Paper"; Url="https://raw.githubusercontent.com/gabl18/GAMEDEVTVJam2025/ad55540f245ac9469712015c362bc7d20e0e8538/gamedevtvjam/Assets/Audio/SFX/writingpensignaturepaper-102967.mp3"; Target="core/src/main/assets/sounds/echoes/ledger_pen_write.mp3"; Sha256="2bb4ba4c07e3ec0f2f747885b4164e10cb6e3bdd058de740f5910706a831ea59" },
            @{ Name="Traditional Stamp"; Url="https://raw.githubusercontent.com/matt-macarte/felpojam-2026/fe3c64d378447fbcacbb6155c5f72a5ffe0092e2/assets/musga/freesound_community-traditional-stamp-44189.mp3"; Target="core/src/main/assets/sounds/echoes/ledger_stamp.mp3"; Sha256="8ebefdd86e4c5676888aaf8a50b39453200ae9bfc7f8f815e1874c9d1830213d" }
          )
          foreach ($asset in $assets) {
            $targetDir = Split-Path -Parent $asset.Target
            New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
            Write-Host "Downloading $($asset.Name)"
            curl.exe -L --fail --retry 3 --retry-delay 2 $asset.Url -o $asset.Target
            if ($LASTEXITCODE -ne 0) { throw "Failed to download Echoes audio asset: $($asset.Name)" }
            $actual = (Get-FileHash -Path $asset.Target -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset.Sha256 -eq "DISCOVER") { Write-Host "DISCOVERED SHA256 $($asset.Name): $actual" }
            elseif ($actual -ne $asset.Sha256) { throw "Echoes audio SHA256 mismatch for $($asset.Name). Expected $($asset.Sha256), got $actual" }
            else { Write-Host "Verified $($asset.Name): $actual" }
          }

          $wingZip = Join-Path $env:RUNNER_TEMP "wings_flap_large.zip"
          $wingUrl = "https://opengameart.org/sites/default/files/wings_flap_large.zip"
          $wingExpected = "f0907c3639f1cc828ac54c9527e8e458d0ca173626d050a8eb8df54a9e36c1b5"
          curl.exe -L --fail --retry 3 --retry-delay 2 $wingUrl -o $wingZip
          if ($LASTEXITCODE -ne 0) { throw "Failed to download OpenGameArt Large Wings Flap CC0." }
          $wingHash = (Get-FileHash -Path $wingZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($wingHash -ne $wingExpected) { throw "OpenGameArt Large Wings Flap ZIP SHA256 mismatch. Expected $wingExpected, got $wingHash" }
          $wingExtract = Join-Path $env:RUNNER_TEMP "wings_flap_large"
          Expand-Archive -Path $wingZip -DestinationPath $wingExtract -Force
          $wing = Get-ChildItem -Path $wingExtract -Recurse -File -Filter "wings_flap_large.ogg" | Select-Object -First 1
          if (-not $wing) { throw "Large Wings Flap archive did not contain wings_flap_large.ogg." }
          $memberExpected = "060d1e2b9403893c4aaff7148ea604c4bcfc6bf3e7bab44913a56429ff261a9c"
          $memberHash = (Get-FileHash $wing.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($memberHash -ne $memberExpected) { throw "Large Wings Flap OGG SHA256 mismatch. Expected $memberExpected, got $memberHash" }
          $wingTarget = "core/src/main/assets/sounds/echoes/ch1_raven_wings.ogg"
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $wingTarget) | Out-Null
          Copy-Item $wing.FullName $wingTarget -Force
          Write-Host "Verified OpenGameArt Large Wings Flap CC0 ZIP/member: $wingHash / $memberHash"

      - name: Generate deterministic Yendor signature cue
        run: python tools/generate_yendor_signature.py

      - name: Generate Visual Foundation terrain atlases
        run: python tools/generate_visual_foundation.py

      - name: Generate production dialogue portraits
        run: python tools/generate_dialogue_portraits_v1.py

      - name: Validate custom PNG assets
        run: python tools/validate_pngs.py

      - name: Validate production character assets
        run: python tools/validate_character_assets_v1.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          cache-read-only: false

      - name: Build Android debug APK
        shell: pwsh
        run: .\gradlew.bat android:assembleDebug --no-build-cache --stacktrace

      - name: Verify installable APK exists
        shell: pwsh
        run: |
          $apks = Get-ChildItem -Path "android/build/outputs/apk/debug" -Filter "*.apk" -File
          if (-not $apks) { Write-Error "Android assembleDebug completed but no APK was found."; exit 1 }
          $apks | ForEach-Object { Write-Host $_.FullName }

      - name: Upload Android debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Echoes-of-Yendor-Android-APK
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
