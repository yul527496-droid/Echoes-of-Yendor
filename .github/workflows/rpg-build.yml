name: Echoes of Yendor Windows EXE Build

on:
  push:
    branches:
      - "rpg-development"
      - "build-test"
  workflow_dispatch:

concurrency:
  group: echoes-windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-native-build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Inject pinned Fusion Pixel font for V2 A/B test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "2026.08.11"
          $archive = "fusion-pixel-font-12px-proportional-ttf-v$version.zip"
          $url = "https://github.com/TakWolf/fusion-pixel-font/releases/download/$version/$archive"
          $expected = "58cc7021a24749ad9405845e499a2ef0a1709e2d90adc242cf198cb278dc065e"
          $zip = Join-Path $env:RUNNER_TEMP $archive
          $extract = Join-Path $env:RUNNER_TEMP "fusion-pixel-font"

          curl.exe -L --fail --retry 3 --retry-delay 2 $url -o $zip
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download pinned Fusion Pixel Font release."
          }

          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Fusion Pixel Font SHA256 mismatch. Expected $expected, got $actual"
          }

          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $font = Get-ChildItem -Path $extract -Recurse -File -Filter "fusion-pixel-12px-proportional-zh_hans.ttf" | Select-Object -First 1
          if (-not $font) {
            throw "Pinned archive did not contain fusion-pixel-12px-proportional-zh_hans.ttf"
          }

          $fontDir = "core/src/main/assets/fonts"
          New-Item -ItemType Directory -Force -Path $fontDir | Out-Null
          Copy-Item $font.FullName (Join-Path $fontDir "fusion_pixel_12_prop_zh_hans.ttf") -Force

          $licenseUrl = "https://raw.githubusercontent.com/TakWolf/fusion-pixel-font/$version/LICENSE-OFL"
          curl.exe -L --fail --retry 3 --retry-delay 2 $licenseUrl -o (Join-Path $fontDir "FUSION_PIXEL_FONT_LICENSE.txt")
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download Fusion Pixel Font OFL license."
          }

          Write-Host "Pinned Fusion Pixel Font injected and SHA256 verified: $actual"

      - name: Validate custom PNG assets
        run: python tools/validate_pngs.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          cache-read-only: false

      - name: Build Windows native EXE image
        shell: pwsh
        run: .\gradlew.bat desktop:jpackageimage --no-build-cache --stacktrace

      - name: Verify runnable Windows launcher
        shell: pwsh
        run: |
          $launchers = Get-ChildItem -Path "desktop/build/jpackage" -Recurse -Filter "*.exe" |
            Where-Object { $_.FullName -notmatch '[\\/]runtime[\\/]'
            }

          if (-not $launchers) {
            Write-Error "jpackage completed but no application .exe launcher was found."
            exit 1
          }

          Write-Host "Runnable launcher(s):"
          $launchers | ForEach-Object { Write-Host $_.FullName }

      - name: Upload ready-to-run Windows build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Echoes-of-Yendor-Windows-EXE
          path: desktop/build/jpackage/**
          if-no-files-found: error
          retention-days: 14
