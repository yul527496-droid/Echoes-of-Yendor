name: Echoes of Yendor Windows Build

on:
  push:
    branches: [ "rpg-development" ]
  workflow_dispatch:

jobs:
  windows-native-build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Validate custom PNG assets
        run: python tools/validate_pngs.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Build Windows native image
        run: .\gradlew.bat desktop:jpackageimage

      - name: Upload Windows build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Echoes-of-Yendor-Windows
          path: desktop/build/jpackage/**
          if-no-files-found: error
