name: Echoes of Yendor Windows Build

on:
  push:
    branches: [ "rpg-development" ]
  workflow_dispatch:

jobs:
  windows-native-build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Validate custom PNG assets
        run: python tools/validate_pngs.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          cache-read-only: false

      - name: Build Windows native image
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Gradle build attempt $attempt of $maxAttempts"
            .\gradlew.bat desktop:jpackageimage
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq $maxAttempts) { exit $LASTEXITCODE }
            Start-Sleep -Seconds (15 * $attempt)
          }

      - name: Upload Windows build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Echoes-of-Yendor-Windows
          path: desktop/build/jpackage/**
          if-no-files-found: error
          retention-days: 14
